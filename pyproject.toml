[project]
name = "paicli-python"
version = "0.1.0"
description = "Multi-agent CLI for local Python debugging and regression verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agent", "ai", "cli", "llm", "mcp", "react", "terminal"]
dependencies = [
  "httpx>=0.27.0",
  "langgraph>=1.0,<2",
  "mcp>=1.27,<2",
  "pillow>=10.0",
  "prompt-toolkit>=3.0.43",
  "python-docx>=1.2.0",
  "rich>=13.7.0",
  "typer>=0.12.3",
]

[project.scripts]
paicli = "paicli.entrypoints.cli:app"

[project.optional-dependencies]
retrieval = ["fastembed>=0.7,<1"]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/paicli"]
